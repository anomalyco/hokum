[package]
name = "hokum"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Hokum (hokum.app): a control center for Wayland (notifications, sound, Bluetooth), drawn with Rune."
homepage = "https://hokum.app"
repository = "https://github.com/anomalyco/hokum"

[dependencies]
rune = { git = "https://github.com/salemsayed/rune.git", rev = "57e1997509f33126282e2e616a6deb371e5d0e26" }
rune-kit = { git = "https://github.com/salemsayed/rune.git", rev = "57e1997509f33126282e2e616a6deb371e5d0e26" }
rune-theme-opencode = { git = "https://github.com/salemsayed/rune.git", rev = "57e1997509f33126282e2e616a6deb371e5d0e26" }
zbus = "5"
pipewire = "0.10"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
kdl = "6"
rhai = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
wayland-client = "0.31"
skrifa = "0.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
codegen-units = 16
