[package]
name = "hokum"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Hokum (hokum.app): a control center for Wayland (notifications, sound, Bluetooth), drawn with Rune."
homepage = "https://hokum.app"
repository = "https://github.com/anomalyco/hokum"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "f6d096bf6a22f1c1488300a5b380f8b709de7a72" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "f6d096bf6a22f1c1488300a5b380f8b709de7a72" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "f6d096bf6a22f1c1488300a5b380f8b709de7a72" }
zbus = "5"
pipewire = "0.10"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
kdl = "6"
rhai = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
wayland-client = "0.31"

[profile.release]
codegen-units = 16
