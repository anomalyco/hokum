name: AUR key verify (temporary)

# Temporary: proves the release environment can read the shared AUR key from
# AWS and that it lists hokum-bin. Deleted once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/hokum-release
          role-session-name: hokum-aur-verify-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the AUR key
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            AUR_SSH_PRIVATE_KEY,shared/AUR_SSH_KEY
          parse-json-secrets: false
      - name: List the AUR account's packages with the key
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ env.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          key="$RUNNER_TEMP/aur-key"
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key")
          chmod 600 "$key"
          repos=$(ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            aur@aur.archlinux.org list-repos)
          rm -f "$key"
          printf '%s\n' "$repos"
          grep -qx 'hokum-bin' <<< "$repos"
          echo "hokum-bin is listed for the key's AUR account."
